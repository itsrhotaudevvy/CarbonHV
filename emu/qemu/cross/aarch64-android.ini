# meson cross file for aarch64 Android, API 30 (`minSdk 30`).
#
# `build-android.sh --build` copies this file into the build directory, replacing @DEPS@ with the
# private static prefix, and puts $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/<host>/bin on PATH so
# the versioned clang wrapper (which sets the API level and sysroot) is found.

[binaries]
c = 'aarch64-linux-android30-clang'
cpp = 'aarch64-linux-android30-clang++'
ar = 'llvm-ar'
ranlib = 'llvm-ranlib'
strip = 'llvm-strip'
pkg-config = 'pkg-config'

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[properties]
# Only the cross prefix is searched; host (Homebrew) libraries must never leak into the build.
pkg_config_libdir = '@DEPS@/lib/pkgconfig'
needs_exe_wrapper = true

[built-in options]
c_args = ['-fPIC', '-O2']
cpp_args = ['-fPIC', '-O2']
# 16 KiB max page size keeps the binary loadable on 16 KiB-page Android kernels.
c_link_args = ['-Wl,-z,max-page-size=16384', '-Wl,--build-id=sha1']
cpp_link_args = ['-Wl,-z,max-page-size=16384', '-Wl,--build-id=sha1']
default_library = 'static'

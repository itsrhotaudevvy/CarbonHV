[binaries]
c = 'aarch64-linux-android30-clang'
cpp = 'aarch64-linux-android30-clang++'
ar = 'llvm-ar'
strip = 'llvm-strip'
pkg-config = 'pkg-config'
# meson finds the NDK's sysroot through the wrapper scripts the NDK ships; `build-android.sh`
# adds $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/<host>/bin to PATH and sets CC/CFLAGS below.

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[properties]
# API 30 is `minSdk 30`; AHardwareBuffer fd passing, AAudio and Vulkan 1.1 are all available.
needs_exe_wrapper = true
# QEMU is cross-built; its build-time helper programs cannot run on the host without an emulator.
skip_sanity_check = true

[built-in options]
c_args = ['-fPIC', '-O2', '-fvisibility=hidden', '-D__ANDROID_API__=30']
cpp_args = ['-fPIC', '-O2', '-fvisibility=hidden', '-D__ANDROID_API__=30']
c_link_args = ['-Wl,-z,max-page-size=16384', '-Wl,--build-id=sha1']
cpp_link_args = ['-Wl,-z,max-page-size=16384', '-Wl,--build-id=sha1']
default_library = 'static'

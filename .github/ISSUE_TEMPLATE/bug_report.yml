name: Bug report
description: Something in the source, tooling, app or docs behaves incorrectly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, test names or app steps.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Broker / carbonhvd (Rust)
        - Host integration / SELinux / Soong
        - Android app
        - Guest recipes (GrapheneOS-derived / Ubuntu Touch)
        - Qualification tooling
        - Documentation
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Rust/JDK versions, commit, and device tuple if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text

name: Feature request
description: Propose a capability or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: checkboxes
    id: principles
    attributes:
      label: Fit with CarbonHV's principles
      options:
        - label: Does not add a software CPU emulation fallback.
        - label: Does not weaken isolation (SELinux/AppArmor, protected-VM semantics, mitigations).
        - label: Keeps vendor differences host-side (no guest-visible CVD1 fork).

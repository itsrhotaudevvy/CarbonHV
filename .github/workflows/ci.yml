name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: scripts/verify.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.2.13676358" >/dev/null

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - uses: actions/cache@v4
        with:
          path: .gradle-local
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Verify
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-local
        run: scripts/verify.sh

      - name: Build release APK
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-local
          CARBONHV_KEYSTORE_BASE64: ${{ secrets.CARBONHV_KEYSTORE_BASE64 }}
          CARBONHV_KEYSTORE_PASSWORD: ${{ secrets.CARBONHV_KEYSTORE_PASSWORD }}
          CARBONHV_KEY_ALIAS: ${{ secrets.CARBONHV_KEY_ALIAS }}
          CARBONHV_KEY_PASSWORD: ${{ secrets.CARBONHV_KEY_PASSWORD }}
        run: |
          # A keystore secret is optional; without it the APK is debug-key signed and named so.
          if [[ -n "$CARBONHV_KEYSTORE_BASE64" ]]; then
            printf '%s' "$CARBONHV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export CARBONHV_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          scripts/build-apk.sh --release --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: carbonhv-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: carbonhv-release-apk
          path: |
            dist/*.apk
            dist/*.txt
          if-no-files-found: error

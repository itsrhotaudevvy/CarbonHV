name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-linux:
    name: Verify and build (Linux x86_64 + APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.2.13676358" >/dev/null
      - name: Verify
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-local
        run: scripts/verify.sh
      - name: Package CLI
        run: |
          cargo build --release -p carbon-cli
          mkdir -p dist
          tar -C target/release -czf "dist/carbonctl-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" carbonctl
      - name: Package release APK
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-local
          CARBONHV_KEYSTORE_BASE64: ${{ secrets.CARBONHV_KEYSTORE_BASE64 }}
          CARBONHV_KEYSTORE_PASSWORD: ${{ secrets.CARBONHV_KEYSTORE_PASSWORD }}
          CARBONHV_KEY_ALIAS: ${{ secrets.CARBONHV_KEY_ALIAS }}
          CARBONHV_KEY_PASSWORD: ${{ secrets.CARBONHV_KEY_PASSWORD }}
        run: |
          # With the keystore secrets set, this is a distributable build. Without them the APK is
          # signed with the debug key and named `-release-debugkey` so nobody mistakes it for one.
          if [[ -n "$CARBONHV_KEYSTORE_BASE64" ]]; then
            printf '%s' "$CARBONHV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export CARBONHV_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          scripts/build-apk.sh --release --tag "$GITHUB_REF_NAME" --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*

  build-macos:
    name: Build carbonctl (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package
        run: |
          cargo test -p carbon-core -p carbon-cli
          cargo build --release -p carbon-cli
          mkdir -p dist
          tar -C target/release -czf "dist/carbonctl-${GITHUB_REF_NAME}-aarch64-macos.tar.gz" carbonctl
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*

  publish:
    name: Publish GitHub release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Refuse a debug-key APK in a release
        run: |
          if compgen -G "dist/*-release-debugkey.apk" >/dev/null; then
            echo "the release APK is debug-key signed: set CARBONHV_KEYSTORE_BASE64 and" >&2
            echo "CARBONHV_KEYSTORE_PASSWORD (plus CARBONHV_KEY_ALIAS/CARBONHV_KEY_PASSWORD)" >&2
            echo "before tagging, or the published APK cannot be updated over." >&2
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "CarbonHV $GITHUB_REF_NAME" --notes-file notes.md --verify-tag "${prerelease[@]}"

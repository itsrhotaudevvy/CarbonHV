version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Pinned to the crosvm revision in Cargo.toml [workspace.metadata.carbonhv.renderer-upstream];
      # bump together with crosvm/gfxstream, never alone.
      - dependency-name: magma-gpu
      - dependency-name: rutabaga_gfx

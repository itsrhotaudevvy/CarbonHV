[package]
name = "carbon-renderer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
native-gfxstream = ["dep:magma-gpu", "dep:rutabaga_gfx", "rutabaga_gfx/gfxstream"]

[dependencies]
carbon-core = { path = "../carbon-core" }
magma-gpu = { version = "=0.1.85", optional = true }
rutabaga_gfx = { version = "=0.1.80", optional = true }
